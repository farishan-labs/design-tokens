# NOTE: CI runs only on PR + push to main to avoid noisy runs.
# Email-on-failure: GitHub notifies watchers by default; disable in GitHub Settings -> Notifications -> Actions,
# or repo Settings -> Notifications. Non-blocking steps use continue-on-error.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run gen:tokens
      - run: bun run check
      - run: bun test